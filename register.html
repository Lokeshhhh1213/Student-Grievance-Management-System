<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Student Grievance Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <!-- 3D Floating Geometry Backdrop -->
    <div class="auth-3d-backdrop">
        <div class="auth-3d-shape shape-1"></div>
        <div class="auth-3d-shape shape-2"></div>
        <div class="auth-3d-shape shape-3"></div>
    </div>

    <div class="auth-card wide animate-scale-up" data-tilt data-tilt-max="6">
        <div class="auth-header">
            <a href="index.html" class="d-inline-block text-decoration-none">
                <div class="brand-icon">🎓</div>
            </a>
            <h2 class="auth-title">Student Registration</h2>
            <p class="auth-subtitle">Create your college grievance account to lodge complaints and track status</p>
        </div>

        <form id="student-register-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="reg-name" class="form-label">Full Name *</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="e.g. Neha Sharma" required autofocus>
                </div>

                <div class="form-group">
                    <label for="reg-id" class="form-label">Student ID / Roll No *</label>
                    <input type="text" id="reg-id" class="form-control" placeholder="e.g. STU1006" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="reg-email" class="form-label">College / Personal Email *</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="e.g. neha.sharma@college.com" required>
                </div>

                <div class="form-group">
                    <label for="reg-phone" class="form-label">Phone Number *</label>
                    <input type="tel" id="reg-phone" class="form-control" placeholder="e.g. +91 98765 00000" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="reg-dept" class="form-label">Department *</label>
                    <select id="reg-dept" class="form-control" required>
                        <option value="">-- Select Department --</option>
                        <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Electronics & Communication">Electronics & Communication</option>
                        <option value="Electrical Engineering">Electrical Engineering</option>
                        <option value="Mechanical Engineering">Mechanical Engineering</option>
                        <option value="Civil Engineering">Civil Engineering</option>
                        <option value="Biotechnology">Biotechnology</option>
                        <option value="Management Studies">Management Studies</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reg-year" class="form-label">Year of Study *</label>
                    <select id="reg-year" class="form-control" required>
                        <option value="">-- Select Academic Year --</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                        <option value="Final Year">Final Year</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="reg-password" class="form-label">Password *</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="reg-confirm-password" class="form-label">Confirm Password *</label>
                    <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-type password" minlength="6" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg mt-2">Complete Registration</button>
        </form>

        <div class="text-center mt-3 pt-3" style="border-top: 1px solid var(--slate-200);">
            <p class="text-muted small">Already registered? <a href="login.html" class="font-weight-600">Sign in here</a></p>
            <p class="text-muted small mt-2"><a href="index.html">← Return to Home Page</a></p>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/complaints.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.redirectIfStudentLoggedIn('dashboard.html');

            const form = document.getElementById('student-register-form');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();

                    const name = document.getElementById('reg-name').value;
                    const id = document.getElementById('reg-id').value;
                    const email = document.getElementById('reg-email').value;
                    const phone = document.getElementById('reg-phone').value;
                    const department = document.getElementById('reg-dept').value;
                    const year = document.getElementById('reg-year').value;
                    const password = document.getElementById('reg-password').value;
                    const confirmPassword = document.getElementById('reg-confirm-password').value;

                    const res = Auth.registerStudent({
                        name, id, email, phone, department, year, password, confirmPassword
                    });

                    if (res.success) {
                        showToast("Account created successfully! Redirecting...", "success");
                        setTimeout(() => {
                            window.location.href = "dashboard.html";
                        }, 1000);
                    } else {
                        showToast(res.message, "error");
                    }
                });
            }
        });
    </script>
</body>
</html>
