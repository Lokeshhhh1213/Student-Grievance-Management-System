<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Complaints | Grievance Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dashboard-layout">
        <!-- Sidebar Navigation -->
        <aside class="dashboard-sidebar" aria-label="Student Navigation">
            <div class="sidebar-header">
                <div class="brand-icon" style="width:36px;height:36px;font-size:1.1rem;">🎓</div>
                <div>
                    <h2>Student Portal</h2>
                    <span>Grievance Center</span>
                </div>
            </div>

            <ul class="sidebar-menu">
                <li><a href="dashboard.html" class="sidebar-link"><span class="sidebar-icon">📊</span> Dashboard</a></li>
                <li><a href="submit-complaint.html" class="sidebar-link"><span class="sidebar-icon">✍️</span> Submit Complaint</a></li>
                <li><a href="track-complaint.html" class="sidebar-link"><span class="sidebar-icon">🔍</span> Track Complaint</a></li>
                <li><a href="my-complaints.html" class="sidebar-link active"><span class="sidebar-icon">📑</span> My Complaints</a></li>
                <li><a href="profile.html" class="sidebar-link"><span class="sidebar-icon">👤</span> My Profile</a></li>
            </ul>

            <div class="sidebar-footer">
                <a href="javascript:void(0)" onclick="Auth.logoutStudent('login.html')" class="btn btn-danger-soft w-100 btn-sm">🚪 Logout</a>
            </div>
        </aside>

        <div class="sidebar-overlay"></div>

        <!-- Main Content Area -->
        <div class="dashboard-main">
            <!-- Topbar -->
            <header class="dashboard-topbar">
                <div class="d-flex align-center gap-2">
                    <button type="button" class="sidebar-toggle" aria-label="Toggle menu">☰</button>
                    <div>
                        <h2 style="font-size: 1.2rem; margin:0;">My Grievances & Complaints</h2>
                        <span class="text-muted small" id="complaints-count-display">Loading complaints...</span>
                    </div>
                </div>

                <div class="d-flex align-center gap-2">
                    <a href="submit-complaint.html" class="btn btn-primary btn-sm">+ Submit New</a>
                </div>
            </header>

            <main class="dashboard-content">
                <!-- Filters & Search Toolbar -->
                <div class="card mb-4">
                    <div class="card-body py-3">
                        <div class="d-flex gap-2 flex-wrap align-center">
                            <!-- Search -->
                            <div style="flex: 1.5; min-width: 220px;">
                                <input type="text" id="filter-search" class="form-control" placeholder="Search by ID, keyword, or location...">
                            </div>

                            <!-- Category Filter -->
                            <div style="flex: 1; min-width: 150px;">
                                <select id="filter-category" class="form-control">
                                    <option value="all">All Categories</option>
                                    <!-- Populated dynamically -->
                                </select>
                            </div>

                            <!-- Status Filter -->
                            <div style="flex: 1; min-width: 140px;">
                                <select id="filter-status" class="form-control">
                                    <option value="all">All Statuses</option>
                                    <option value="Submitted">Submitted</option>
                                    <option value="Under Review">Under Review</option>
                                    <option value="In Progress">In Progress</option>
                                    <option value="Resolved">Resolved</option>
                                    <option value="Rejected">Rejected</option>
                                    <option value="Closed">Closed</option>
                                </select>
                            </div>

                            <!-- Priority Filter -->
                            <div style="flex: 0.8; min-width: 130px;">
                                <select id="filter-priority" class="form-control">
                                    <option value="all">All Priorities</option>
                                    <option value="Low">Low</option>
                                    <option value="Medium">Medium</option>
                                    <option value="High">High</option>
                                    <option value="Urgent">Urgent</option>
                                </select>
                            </div>

                            <!-- Sort -->
                            <div style="flex: 0.8; min-width: 130px;">
                                <select id="filter-sort" class="form-control">
                                    <option value="newest">Newest First</option>
                                    <option value="oldest">Oldest First</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Complaints Grid Container -->
                <div id="my-complaints-list">
                    <!-- Populated dynamically by student.js -->
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/complaints.js"></script>
    <script src="js/student.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            StudentController.initMyComplaints();
        });
    </script>
</body>
</html>
