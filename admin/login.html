<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login | Grievance Management System</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page" style="background: radial-gradient(circle at 10% 20%, #1e293b 0%, #0f172a 90%);">

    <!-- 3D Floating Geometry Backdrop -->
    <div class="auth-3d-backdrop">
        <div class="auth-3d-shape shape-1"></div>
        <div class="auth-3d-shape shape-2"></div>
        <div class="auth-3d-shape shape-3"></div>
    </div>

    <div class="auth-card animate-scale-up" data-tilt data-tilt-max="8" style="border-color: var(--navy-700);">
        <div class="auth-header">
            <a href="../index.html" class="d-inline-block text-decoration-none">
                <div class="brand-icon" style="background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);">🏛️</div>
            </a>
            <h2 class="auth-title">Administrator Portal</h2>
            <p class="auth-subtitle">College Administration & Grievance Redressal Cell</p>
        </div>

        <!-- Demo Admin Credentials Box -->
        <div class="demo-credentials-box" style="background: #f1f5f9;">
            <div class="d-flex justify-between align-center mb-1">
                <strong>Demo Admin Credentials:</strong>
                <button type="button" class="btn btn-xs btn-outline-primary" id="fill-admin-btn">Auto-Fill</button>
            </div>
            <p><strong>Email:</strong> <code>admin@college.com</code></p>
            <p><strong>Password:</strong> <code>admin123</code></p>
        </div>

        <form id="admin-login-form">
            <div class="form-group">
                <label for="admin-email" class="form-label">Administrator Email *</label>
                <input type="email" id="admin-email" class="form-control" placeholder="admin@college.com" required autofocus>
            </div>

            <div class="form-group">
                <label for="admin-password" class="form-label">Admin Password *</label>
                <input type="password" id="admin-password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg mt-2">Access Admin Dashboard</button>
        </form>

        <div class="text-center mt-3 pt-3" style="border-top: 1px solid var(--slate-200);">
            <p class="text-muted small">Are you a student? <a href="../login.html" class="font-weight-600">Student Portal Login</a></p>
            <p class="text-muted small mt-2"><a href="../index.html">← Return to Public Website</a></p>
        </div>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/complaints.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.redirectIfAdminLoggedIn('dashboard.html');

            const form = document.getElementById('admin-login-form');
            const emailInput = document.getElementById('admin-email');
            const passInput = document.getElementById('admin-password');
            const fillBtn = document.getElementById('fill-admin-btn');

            if (fillBtn) {
                fillBtn.addEventListener('click', () => {
                    emailInput.value = 'admin@college.com';
                    passInput.value = 'admin123';
                    showToast('Admin demo credentials populated!', 'info', 2000);
                });
            }

            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const email = emailInput.value;
                    const password = passInput.value;

                    const res = Auth.loginAdmin(email, password);
                    if (res.success) {
                        showToast("Admin authenticated! Opening dashboard...", "success");
                        setTimeout(() => {
                            window.location.href = "dashboard.html";
                        }, 800);
                    } else {
                        showToast(res.message, "error");
                    }
                });
            }
        });
    </script>
</body>
</html>
