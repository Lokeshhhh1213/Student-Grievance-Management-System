<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Details | Grievance Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dashboard-layout">
        <!-- Sidebar Navigation -->
        <aside class="dashboard-sidebar" aria-label="Student Navigation">
            <div class="sidebar-header">
                <div class="brand-icon" style="width:36px;height:36px;font-size:1.1rem;">🎓</div>
                <div>
                    <h2>Student Portal</h2>
                    <span>Grievance Center</span>
                </div>
            </div>

            <ul class="sidebar-menu">
                <li><a href="dashboard.html" class="sidebar-link"><span class="sidebar-icon">📊</span> Dashboard</a></li>
                <li><a href="submit-complaint.html" class="sidebar-link"><span class="sidebar-icon">✍️</span> Submit Complaint</a></li>
                <li><a href="track-complaint.html" class="sidebar-link"><span class="sidebar-icon">🔍</span> Track Complaint</a></li>
                <li><a href="my-complaints.html" class="sidebar-link active"><span class="sidebar-icon">📑</span> My Complaints</a></li>
                <li><a href="profile.html" class="sidebar-link"><span class="sidebar-icon">👤</span> My Profile</a></li>
            </ul>

            <div class="sidebar-footer">
                <a href="javascript:void(0)" onclick="Auth.logoutStudent('login.html')" class="btn btn-danger-soft w-100 btn-sm">🚪 Logout</a>
            </div>
        </aside>

        <div class="sidebar-overlay"></div>

        <!-- Main Content Area -->
        <div class="dashboard-main">
            <!-- Topbar -->
            <header class="dashboard-topbar">
                <div class="d-flex align-center gap-2">
                    <button type="button" class="sidebar-toggle" aria-label="Toggle menu">☰</button>
                    <div>
                        <h2 style="font-size: 1.2rem; margin:0;">Complaint Detailed Record</h2>
                        <span class="text-muted small">View comprehensive logs, status, and administration response</span>
                    </div>
                </div>

                <div class="d-flex align-center gap-2">
                    <a href="my-complaints.html" class="btn btn-outline-secondary btn-sm">← Back to Complaints</a>
                </div>
            </header>

            <main class="dashboard-content">
                <div id="complaint-detail-container" style="max-width: 960px; margin: 0 auto;">
                    <!-- Populated dynamically by student.js -->
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/complaints.js"></script>
    <script src="js/student.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            StudentController.initComplaintDetails();
        });
    </script>
</body>
</html>
